<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ppuri - Menú de la Semana</title>
</head>
<!-- Mantenemos el fondo de mantel cuadriculado sutil que elegiste -->
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f7fafc; background-image: linear-gradient(90deg, rgba(230,235,240,0.5) 1px, transparent 1px), linear-gradient(rgba(230,235,240,0.5) 1px, transparent 1px); background-size: 20px 20px; color: #2d3748;">

    <!-- ACÁ SE COLOCA TU FOTO: Cambiamos el fondo blanco de antes por tu imagen 'portada.jpg' -->
    <header style="position: relative; text-align: center; padding: 50px 20px; background-image: linear-gradient(rgba(45, 55, 72, 0.7), rgba(45, 55, 72, 0.7)), url('portada.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <div style="max-width: 600px; margin: 0 auto; position: relative; z-index: 2;">
            
            <!-- Tu Logo Ppuri sigue acá, flotando sobre tu foto con su borde dorado -->
            <img src="logo-ppuri.jpg" alt="Ppuri Logo" style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid #d4af37; box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);">
            
            <!-- El título ahora es blanco para que se lea perfectamente sobre tu foto -->
            <h1 style="color: #ffffff; margin-top: 20px; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Menú de la Semana</h1>
            
            <!-- Subtítulo en un tono claro para combinar con el fondo -->
            <p style="color: #ff9e9e; font-size: 16px; font-weight: 600; margin: 5px 0 0 0; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">Sabor Único & Tradición</p>
        </div>
    </header>

    <!-- TODO LO DE ABAJO QUEDA EXACTAMENTE IGUAL AL MODELO ANTERIOR -->
    <main style="max-width: 500px; margin: 30px auto; padding: 0 20px;">
        
        <!-- Bloque de Información de Entrega con borde Borgoña -->
        <section style="background-color: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-left: 4px solid #792121; margin-bottom: 25px;">
            <h2 style="margin-top: 0; font-size: 16px; color: #792121;">📍 Detalles de Envío</h2>
            <p style="margin: 5px 0; font-size: 15px; color: #4a5568;"><strong>Dirección de entrega:</strong> [Ingresá tu dirección acá]</p>
            <p style="margin: 5px 0; font-size: 15px; color: #4a5568;"><strong>Teléfono de Pedidos:</strong> [Ingresá tu número]</p>
        </section>

        <!-- Sección de Platos Disponibles -->
        <section style="background-color: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); margin-bottom: 25px;">
            <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 20px; color: #2d3748; border-bottom: 2px solid #edf2f7; padding-bottom: 10px;">🍽️ Platos Disponibles</h2>
            
            <!-- Plato 1 -->
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px;">
                <span style="font-weight: 600; color: #2d3748; font-size: 16px;">Plato Ejecutivo del Día</span>
                <span style="font-weight: 700; color: #792121; font-size: 16px;">$0.00</span>
            </div>
            
            <!-- Plato 2 -->
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px;">
                <span style="font-weight: 600; color: #2d3748; font-size: 16px;">Opción Saludable / Ensalada</span>
                <span style="font-weight: 700; color: #792121; font-size: 16px;">$0.00</span>
            </div>
        </section>

        <!-- Botón de Pedidos de WhatsApp usando el Borgoña -->
        <div style="text-align: center; margin-top: 30px;">
            <a href="https://wa.me" style="display: inline-block; background-color: #792121; color: #ffffff; padding: 14px 30px; border-radius: 30px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 14px rgba(121, 33, 33, 0.3); transition: all 0.2s;">
                📱 Hacer Pedido por WhatsApp
</html>

</body>
</html>
